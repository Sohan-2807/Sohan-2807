<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Node Glow Gradient -->
    <radialGradient id="node-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A4CAFE" />
      <stop offset="35%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#162B5C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#6F8FFF" />
      <stop offset="70%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Synapse Line Gradient -->
    <linearGradient id="synapse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6F8FFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#A4CAFE" stop-opacity="0.35" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .synapse {
      stroke: url(#synapse-grad);
      stroke-width: 1.2;
      stroke-dasharray: 4, 8;
      animation: pulseFlow 2.5s linear infinite;
    }
    .synapse-fast {
      stroke: #6F8FFF;
      stroke-width: 1.4;
      stroke-opacity: 0.6;
      stroke-dasharray: 6, 12;
      animation: pulseFlow 1.6s linear infinite;
    }
    @keyframes pulseFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .node-pulse {
      animation: nodeBlink 3s ease-in-out infinite alternate;
    }
    .node-pulse-alt {
      animation: nodeBlink 2.2s ease-in-out infinite alternate-reverse;
    }
    @keyframes nodeBlink {
      0% { r: 6; opacity: 0.85; filter: drop-shadow(0 0 2px #4169E1); }
      100% { r: 8.5; opacity: 1; filter: drop-shadow(0 0 8px #6F8FFF); }
    }
    .layer-label {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #6F8FFF;
      text-anchor: middle;
    }
    .sub-label {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 9px;
      fill: #5A73A3;
      text-anchor: middle;
    }
    .grid-line {
      stroke: #162B5C;
      stroke-width: 0.7;
      stroke-opacity: 0.35;
    }
    .hud-title {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #4169E1;
    }
  </style>

  <!-- Background Card -->
  <rect width="850" height="320" rx="14" fill="url(#bg-grad)" stroke="#162B5C" stroke-width="1.2" />

  <!-- 3D Isometric Ground Grid -->
  <g id="iso-grid">
    <line x1="60" y1="285" x2="790" y2="285" class="grid-line" />
    <line x1="80" y1="265" x2="770" y2="265" class="grid-line" />
    <line x1="100" y1="245" x2="750" y2="245" class="grid-line" />
    <!-- Diagonal Perspective Grid Lines -->
    <line x1="80" y1="285" x2="140" y2="235" class="grid-line" />
    <line x1="220" y1="285" x2="270" y2="235" class="grid-line" />
    <line x1="360" y1="285" x2="400" y2="235" class="grid-line" />
    <line x1="500" y1="285" x2="530" y2="235" class="grid-line" />
    <line x1="640" y1="285" x2="660" y2="235" class="grid-line" />
    <line x1="770" y1="285" x2="780" y2="235" class="grid-line" />
  </g>

  <!-- Header HUD Tag -->
  <text x="35" y="32" class="hud-title">// DEEP NEURAL NETWORK ARCHITECTURE • 3D FEED-FORWARD</text>
  <circle cx="20" cy="28" r="4" fill="#4169E1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- 3D SYNAPSES (CONNECTIONS) -->
  <g id="synapses">
    <!-- Layer 0 (Input x=120) to Layer 1 (Hidden 1 x=270) -->
    <!-- Input Nodes: (120, 80), (120, 135), (120, 190), (120, 245) -->
    <!-- Hidden 1 Nodes: (270, 60), (270, 105), (270, 150), (270, 195), (270, 240), (270, 275) -->
    <path d="M120 80 L270 60 M120 80 L270 105 M120 80 L270 150 M120 80 L270 195 M120 80 L270 240" class="synapse" />
    <path d="M120 135 L270 60 M120 135 L270 105 M120 135 L270 150 M120 135 L270 195 M120 135 L270 240 M120 135 L270 275" class="synapse-fast" />
    <path d="M120 190 L270 60 M120 190 L270 105 M120 190 L270 150 M120 190 L270 195 M120 190 L270 240 M120 190 L270 275" class="synapse" />
    <path d="M120 245 L270 105 M120 245 L270 150 M120 245 L270 195 M120 245 L270 240 M120 245 L270 275" class="synapse-fast" />

    <!-- Layer 1 (Hidden 1 x=270) to Layer 2 (Hidden 2 x=430) -->
    <!-- Hidden 2 Nodes: (430, 50), (430, 95), (430, 140), (430, 185), (430, 230), (430, 270) -->
    <path d="M270 60 L430 50 M270 60 L430 95 M270 60 L430 140 M270 60 L430 185" class="synapse" />
    <path d="M270 105 L430 50 M270 105 L430 95 M270 105 L430 140 M270 105 L430 185 M270 105 L430 230" class="synapse-fast" />
    <path d="M270 150 L430 50 M270 150 L430 95 M270 150 L430 140 M270 150 L430 185 M270 150 L430 230 M270 150 L430 270" class="synapse" />
    <path d="M270 195 L430 95 M270 195 L430 140 M270 195 L430 185 M270 195 L430 230 M270 195 L430 270" class="synapse-fast" />
    <path d="M270 240 L430 140 M270 240 L430 185 M270 240 L430 230 M270 240 L430 270" class="synapse" />
    <path d="M270 275 L430 185 M270 275 L430 230 M270 275 L430 270" class="synapse" />

    <!-- Layer 2 (Hidden 2 x=430) to Layer 3 (Hidden 3 x=580) -->
    <!-- Hidden 3 Nodes: (580, 65), (580, 115), (580, 165), (580, 215), (580, 260) -->
    <path d="M430 50 L580 65 M430 50 L580 115 M430 50 L580 165" class="synapse" />
    <path d="M430 95 L580 65 M430 95 L580 115 M430 95 L580 165 M430 95 L580 215" class="synapse-fast" />
    <path d="M430 140 L580 65 M430 140 L580 115 M430 140 L580 165 M430 140 L580 215 M430 140 L580 260" class="synapse" />
    <path d="M430 185 L580 65 M430 185 L580 115 M430 185 L580 165 M430 185 L580 215 M430 185 L580 260" class="synapse-fast" />
    <path d="M430 230 L580 115 M430 230 L580 165 M430 230 L580 215 M430 230 L580 260" class="synapse" />
    <path d="M430 270 L580 165 M430 270 L580 215 M430 270 L580 260" class="synapse" />

    <!-- Layer 3 (Hidden 3 x=580) to Layer 4 (Output x=730) -->
    <!-- Output Nodes: (730, 100), (730, 160), (730, 220) -->
    <path d="M580 65 L730 100 M580 65 L730 160" class="synapse" />
    <path d="M580 115 L730 100 M580 115 L730 160 M580 115 L730 220" class="synapse-fast" />
    <path d="M580 165 L730 100 M580 165 L730 160 M580 165 L730 220" class="synapse" />
    <path d="M580 215 L730 100 M580 215 L730 160 M580 215 L730 220" class="synapse-fast" />
    <path d="M580 260 L730 160 M580 260 L730 220" class="synapse" />
  </g>

  <!-- NODES WITH 3D DEPTH GLOW -->
  <!-- Layer 0: Input Layer (x=120) -->
  <g id="layer-input">
    <line x1="120" y1="55" x2="120" y2="265" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <circle cx="120" cy="80" r="7" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="120" cy="135" r="7" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="120" cy="190" r="7" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="120" cy="245" r="7" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <text x="120" y="295" class="layer-label">INPUT</text>
    <text x="120" y="308" class="sub-label">dim(x) = 4</text>
  </g>

  <!-- Layer 1: Hidden Layer 1 (x=270) -->
  <g id="layer-hidden-1">
    <line x1="270" y1="45" x2="270" y2="285" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <circle cx="270" cy="60" r="6" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="270" cy="105" r="6" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="270" cy="150" r="7" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="270" cy="195" r="6" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="270" cy="240" r="6" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="270" cy="275" r="6" fill="url(#node-glow-cyan)" class="node-pulse" />
    <text x="270" y="295" class="layer-label">HIDDEN 1</text>
    <text x="270" y="308" class="sub-label">ReLU · 6</text>
  </g>

  <!-- Layer 2: Hidden Layer 2 (x=430) -->
  <g id="layer-hidden-2">
    <line x1="430" y1="35" x2="430" y2="285" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <circle cx="430" cy="50" r="6.5" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="430" cy="95" r="6.5" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="430" cy="140" r="8" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="430" cy="185" r="6.5" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="430" cy="230" r="6.5" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="430" cy="270" r="6.5" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <text x="430" y="295" class="layer-label">LATENT SPACE</text>
    <text x="430" y="308" class="sub-label">Embeddings · 6</text>
  </g>

  <!-- Layer 3: Hidden Layer 3 (x=580) -->
  <g id="layer-hidden-3">
    <line x1="580" y1="50" x2="580" y2="275" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <circle cx="580" cy="65" r="6" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="580" cy="115" r="6" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="580" cy="165" r="7.5" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <circle cx="580" cy="215" r="6" fill="url(#node-glow-cyan)" class="node-pulse" />
    <circle cx="580" cy="260" r="6" fill="url(#node-glow-cyan)" class="node-pulse-alt" />
    <text x="580" y="295" class="layer-label">HIDDEN 3</text>
    <text x="580" y="308" class="sub-label">GELU · 5</text>
  </g>

  <!-- Layer 4: Output Layer (x=730) -->
  <g id="layer-output">
    <line x1="730" y1="80" x2="730" y2="240" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <circle cx="730" cy="100" r="8.5" fill="url(#node-glow-cyan)" class="node-pulse" filter="url(#glow)" />
    <circle cx="730" cy="160" r="9" fill="url(#node-glow-cyan)" class="node-pulse-alt" filter="url(#glow)" />
    <circle cx="730" cy="220" r="8.5" fill="url(#node-glow-cyan)" class="node-pulse" filter="url(#glow)" />
    <text x="730" y="295" class="layer-label">OUTPUT</text>
    <text x="730" y="308" class="sub-label">Softmax · ŷ</text>
  </g>
</svg>