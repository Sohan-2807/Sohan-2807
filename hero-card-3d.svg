<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="40%" stop-color="#04060d" />
      <stop offset="80%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Holographic Diagonal Sheen Sweep -->
    <linearGradient id="sheen-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0" />
      <stop offset="40%" stop-color="#6F8FFF" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#A4CAFE" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6F8FFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#4169E1" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;150%" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;250%" dur="5.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB0FF" />
      <stop offset="50%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#2244B0" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#365BD6" />
      <stop offset="100%" stop-color="#112255" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D99" />
      <stop offset="100%" stop-color="#0A1433" />
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EBF2FF" />
      <stop offset="100%" stop-color="#A4CAFE" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }

    /* Animated Border Laser Beam */
    .border-runner {
      stroke: #6F8FFF;
      stroke-width: 2;
      stroke-dasharray: 120 700;
      animation: runBorder 7s linear infinite;
    }
    @keyframes runBorder {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -820; }
    }

    /* 3D Floating Isometric Object */
    .iso-float {
      animation: floatMotion 3.8s ease-in-out infinite;
    }
    @keyframes floatMotion {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    /* Floating Shadow */
    .shadow-pulse {
      animation: shadowPulse 3.8s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(0.75); opacity: 0.2; }
    }

    /* Orbiting Hologram Ring */
    .hologram-ring {
      transform-origin: center;
      animation: rotateRing 8s linear infinite;
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Neon Pulsing CGPA Text */
    .cgpa-glow {
      animation: cgpaBreathe 3s ease-in-out infinite alternate;
    }
    @keyframes cgpaBreathe {
      0% { filter: drop-shadow(0 0 2px rgba(65, 105, 225, 0.5)); }
      100% { filter: drop-shadow(0 0 12px rgba(111, 143, 255, 0.95)); }
    }

    /* Star Sparkle Glint */
    .sparkle-anim {
      animation: sparkle 2.6s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.1) rotate(90deg); }
    }

    /* Radar Ping for Active Status */
    .radar-wave {
      animation: radarPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 0px 0px;
    }
    @keyframes radarPing {
      0% { r: 3.5; opacity: 0.9; }
      100% { r: 12; opacity: 0; }
    }

    /* Circuit Trace Pulses */
    .circuit-pulse {
      stroke: #6F8FFF;
      stroke-width: 1.5;
      stroke-dasharray: 10 35;
      animation: traceFlow 2s linear infinite;
    }
    @keyframes traceFlow {
      from { stroke-dashoffset: 45; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#card-bg)" stroke="#162B5C" stroke-width="1.2" />

  <!-- Diagonal Light Sheen Sweep Overlay -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#sheen-sweep)" pointer-events="none" />

  <!-- Laser Border Runner Effect -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="none" class="border-runner" />

  <!-- Corner Tech HUD Brackets -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 834 28 L 834 16 L 822 16" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 16 222 L 16 234 L 28 234" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 834 222 L 834 234 L 822 234" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />

  <!-- Subtle Cyberpunk Background Circuits -->
  <g opacity="0.25">
    <path d="M 520 45 L 560 45 L 575 60 L 810 60" fill="none" stroke="#162B5C" stroke-width="1" />
    <path d="M 520 200 L 550 200 L 565 185 L 810 185" fill="none" stroke="#162B5C" stroke-width="1" />
    <path d="M 530 120 L 545 120 L 555 130 L 610 130" fill="none" class="circuit-pulse" />
    <circle cx="610" cy="130" r="2.5" fill="#6F8FFF" />
  </g>

  <!-- ==================== MAIN LEFT/CENTER SECTION: SOHAN THAMMINENI ==================== -->
  <g transform="translate(38, 26)">
    <!-- HUD Top Meta Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3.5" fill="#4169E1" filter="url(#neon-glow)" />
      <circle cx="4" cy="5" r="1.8" fill="#FFFFFF" />
      <text x="16" y="9" class="mono" font-size="10" font-weight="700" fill="#6F8FFF" letter-spacing="1.5">// VERIFIED DEVELOPER PROFILE • AI &amp; ML SPECIALIST</text>
    </g>

    <!-- Prominent Name Display -->
    <text x="0" y="48" class="sans" font-size="33" font-weight="900" fill="url(#name-grad)" letter-spacing="0.3">SOHAN THAMMINENI</text>

    <!-- Role Badge Pill & Status Ripple -->
    <g transform="translate(0, 62)">
      <!-- AI & ML Engineer Badge -->
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#0E1D42" stroke="#4169E1" stroke-width="1.2" />
      <text x="85" y="17" class="mono" font-size="11" font-weight="800" fill="#6F8FFF" text-anchor="middle" letter-spacing="0.8">⚡ AI &amp; ML ENGINEER</text>

      <!-- Active Status Radar Pill -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="185" height="26" rx="13" fill="#06120E" stroke="#00E676" stroke-width="0.9" stroke-opacity="0.6" />
        <g transform="translate(16, 13)">
          <circle cx="0" cy="0" r="3.5" fill="#00E676" class="radar-wave" />
          <circle cx="0" cy="0" r="3.5" fill="#00E676" filter="url(#neon-glow)" />
          <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
        </g>
        <text x="27" y="17" class="sans" font-size="10.5" font-weight="700" fill="#E6FFFA">Undergraduate (Active)</text>
      </g>
    </g>

    <!-- Academic Institution & Degree Section -->
    <g transform="translate(0, 106)">
      <text x="0" y="16" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Lovely Professional University (LPU)</text>
      <text x="0" y="34" class="sans" font-size="12.5" font-weight="600" fill="#A4CAFE">B.Tech Computer Science &amp; Engineering <tspan fill="#6F8FFF">• Specialized in AI &amp; ML</tspan></text>
      <text x="0" y="50" class="mono" font-size="10" font-weight="600" fill="#5A73A3">📍 Punjab, India  |  Class of 2023 - 2027</text>
    </g>

    <!-- Core Technology / Engineering Tags -->
    <g transform="translate(0, 172)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="128" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
      <circle cx="10" cy="11" r="2.5" fill="#6F8FFF" />
      <text x="70" y="15" class="sans" font-size="9.5" font-weight="700" fill="#C5D7FF" text-anchor="middle">Machine Learning</text>

      <!-- Tag 2 -->
      <rect x="136" y="0" width="108" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
      <circle cx="146" cy="11" r="2.5" fill="#6F8FFF" />
      <text x="191" y="15" class="sans" font-size="9.5" font-weight="700" fill="#C5D7FF" text-anchor="middle">Deep Learning</text>

      <!-- Tag 3 -->
      <rect x="252" y="0" width="90" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
      <circle cx="262" cy="11" r="2.5" fill="#6F8FFF" />
      <text x="298" y="15" class="sans" font-size="9.5" font-weight="700" fill="#C5D7FF" text-anchor="middle">DSA (C++/Py)</text>

      <!-- Tag 4 -->
      <rect x="350" y="0" width="112" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
      <circle cx="360" cy="11" r="2.5" fill="#6F8FFF" />
      <text x="407" y="15" class="sans" font-size="9.5" font-weight="700" fill="#C5D7FF" text-anchor="middle">Offline Systems</text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: 3D ISOMETRIC CUBE & 9.49 CGPA ==================== -->
  <g transform="translate(620, 24)">
    <!-- Right Container Box -->
    <rect x="0" y="6" width="198" height="194" rx="14" fill="#060c1d" stroke="#162B5C" stroke-width="1.2" />

    <!-- Top Label -->
    <text x="99" y="28" class="mono" font-size="10" font-weight="700" fill="#6F8FFF" text-anchor="middle" letter-spacing="1.2">ACADEMIC HONORS</text>

    <!-- Ground Shadow Beneath 3D Object -->
    <ellipse cx="99" cy="100" rx="36" ry="11" fill="#0A1838" class="shadow-pulse" filter="url(#neon-glow)" />

    <!-- 3D Floating Isometric Diamond/Cube -->
    <g class="iso-float" transform="translate(99, 62)">
      <!-- Hologram Orbit Ring around 3D Cube -->
      <g class="hologram-ring" transform="translate(0, 0)">
        <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="#4169E1" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.65" />
        <circle cx="45" cy="0" r="3" fill="#A4CAFE" filter="url(#neon-glow)" />
      </g>

      <!-- Isometric Cube Top Diamond -->
      <polygon points="0,-25 35,-8 0,9 -35,-8" fill="url(#cube-top)" filter="url(#neon-glow)" />
      
      <!-- Left Face -->
      <polygon points="-35,-8 0,9 0,39 -35,22" fill="url(#cube-left)" />
      
      <!-- Right Face -->
      <polygon points="0,9 35,-8 35,22 0,39" fill="url(#cube-right)" />

      <!-- Glowing AI Core Center Node -->
      <circle cx="0" cy="-8" r="5" fill="#FFFFFF" filter="url(#intense-glow)" />
      <circle cx="0" cy="-8" r="2.5" fill="#A4CAFE" />

      <!-- Isometric Tassel / Academic Ray -->
      <line x1="0" y1="-8" x2="28" y2="7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
      <circle cx="28" cy="7" r="3" fill="#6F8FFF" filter="url(#neon-glow)" />
    </g>

    <!-- 3D CGPA Glass Card -->
    <g transform="translate(22, 126)">
      <rect x="0" y="0" width="154" height="60" rx="12" fill="#0b1329" fill-opacity="0.9" stroke="#4169E1" stroke-width="1.2" />
      
      <!-- CGPA Number with Neon Breath Effect -->
      <text x="68" y="37" class="sans cgpa-glow" font-size="31" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">9.49</text>
      
      <!-- Star Sparkle Glint on Top Right of Number -->
      <g class="sparkle-anim" transform="translate(112, 20)">
        <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#A4CAFE" />
        <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
      </g>

      <text x="77" y="52" class="mono" font-size="9.5" font-weight="700" fill="#6F8FFF" text-anchor="middle" letter-spacing="1.2">CGPA / 10.00</text>
    </g>
  </g>
</svg>