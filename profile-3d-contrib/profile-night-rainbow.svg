<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#0077B5"/>
      <stop offset="100%" stop-color="#36BCF7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- 3D Isometric Grid Illustration -->
  <g transform="translate(600, 180) scale(1, 0.58) rotate(45)">
    <!-- Base grid -->
    <rect x="-180" y="-180" width="360" height="360" rx="8" fill="#161b22" stroke="#36BCF7" stroke-width="2" opacity="0.4"/>
    <!-- Bars -->
    <rect x="-150" y="-150" width="40" height="40" fill="#36BCF7" opacity="0.9"/>
    <rect x="-90" y="-150" width="40" height="40" fill="#2085c7" opacity="0.8"/>
    <rect x="-30" y="-150" width="40" height="40" fill="#135482" opacity="0.6"/>
    <rect x="30" y="-150" width="40" height="40" fill="#36BCF7" opacity="0.9"/>
    <rect x="90" y="-150" width="40" height="40" fill="#2ea44f" opacity="0.9"/>

    <rect x="-150" y="-90" width="40" height="40" fill="#0e4429" opacity="0.7"/>
    <rect x="-90" y="-90" width="40" height="40" fill="#006d32" opacity="0.8"/>
    <rect x="-30" y="-90" width="40" height="40" fill="#26a641" opacity="0.9"/>
    <rect x="30" y="-90" width="40" height="40" fill="#39d353" opacity="1"/>
    <rect x="90" y="-90" width="40" height="40" fill="#36BCF7" opacity="0.8"/>

    <rect x="-150" y="-30" width="40" height="40" fill="#36BCF7" opacity="0.7"/>
    <rect x="-90" y="-30" width="40" height="40" fill="#58a6ff" opacity="0.9"/>
    <rect x="-30" y="-30" width="40" height="40" fill="#1f6feb" opacity="0.8"/>
    <rect x="30" y="-30" width="40" height="40" fill="#238636" opacity="0.9"/>
    <rect x="90" y="-30" width="40" height="40" fill="#39d353" opacity="1"/>

    <rect x="-150" y="30" width="40" height="40" fill="#2ea44f" opacity="0.8"/>
    <rect x="-90" y="30" width="40" height="40" fill="#36BCF7" opacity="0.9"/>
    <rect x="-30" y="30" width="40" height="40" fill="#58a6ff" opacity="0.7"/>
    <rect x="30" y="30" width="40" height="40" fill="#1f6feb" opacity="0.9"/>
    <rect x="90" y="30" width="40" height="40" fill="#238636" opacity="0.8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#36BCF7" filter="url(#glow)">
    📊 3D Contribution Calendar
  </text>
  <text x="600" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">
    Generated automatically via GitHub Actions (.github/workflows/profile-3d.yml)
  </text>
</svg>
