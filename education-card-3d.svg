<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="40%" stop-color="#04060d" />
      <stop offset="80%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Holographic Diagonal Sheen Sweep -->
    <linearGradient id="sheen-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0" />
      <stop offset="40%" stop-color="#6F8FFF" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#A4CAFE" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6F8FFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#4169E1" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;150%" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;250%" dur="5.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB0FF" />
      <stop offset="50%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#2244B0" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#365BD6" />
      <stop offset="100%" stop-color="#112255" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D99" />
      <stop offset="100%" stop-color="#0A1433" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }

    /* Animated Border Laser Beam */
    .border-runner {
      stroke: #6F8FFF;
      stroke-width: 2;
      stroke-dasharray: 120 700;
      animation: runBorder 7s linear infinite;
    }
    @keyframes runBorder {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -820; }
    }

    /* 3D Floating Isometric Object */
    .iso-float {
      animation: floatMotion 3.8s ease-in-out infinite;
    }
    @keyframes floatMotion {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    /* Floating Shadow */
    .shadow-pulse {
      animation: shadowPulse 3.8s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(0.75); opacity: 0.2; }
    }

    /* Orbiting Hologram Ring */
    .hologram-ring {
      transform-origin: center;
      animation: rotateRing 8s linear infinite;
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Neon Pulsing CGPA Text */
    .cgpa-glow {
      animation: cgpaBreathe 3s ease-in-out infinite alternate;
    }
    @keyframes cgpaBreathe {
      0% { filter: drop-shadow(0 0 2px rgba(65, 105, 225, 0.5)); }
      100% { filter: drop-shadow(0 0 12px rgba(111, 143, 255, 0.95)); }
    }

    /* Star Sparkle Glint */
    .sparkle-anim {
      animation: sparkle 2.6s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.1) rotate(90deg); }
    }

    /* Radar Ping for Active Status */
    .radar-wave {
      animation: radarPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 20px 125px;
    }
    @keyframes radarPing {
      0% { r: 3.5; opacity: 0.9; }
      100% { r: 12; opacity: 0; }
    }

    /* Circuit Trace Pulses */
    .circuit-pulse {
      stroke: #6F8FFF;
      stroke-width: 1.5;
      stroke-dasharray: 10 35;
      animation: traceFlow 2s linear infinite;
    }
    @keyframes traceFlow {
      from { stroke-dashoffset: 45; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#card-bg)" stroke="#162B5C" stroke-width="1.2" />

  <!-- Diagonal Light Sheen Sweep Overlay -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#sheen-sweep)" pointer-events="none" />

  <!-- Laser Border Runner Effect -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="none" class="border-runner" />

  <!-- Corner Tech HUD Brackets -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 834 28 L 834 16 L 822 16" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 16 222 L 16 234 L 28 234" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />
  <path d="M 834 222 L 834 234 L 822 234" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.8" />

  <!-- Subtle Cyberpunk Background Circuits -->
  <g opacity="0.25">
    <path d="M 240 50 L 260 50 L 275 65 L 590 65 L 600 50" fill="none" stroke="#162B5C" stroke-width="1" />
    <path d="M 240 195 L 340 195 L 355 180 L 580 180 L 595 195" fill="none" stroke="#162B5C" stroke-width="1" />
    <path d="M 240 120 L 255 120 L 265 130 L 320 130" fill="none" class="circuit-pulse" />
    <circle cx="320" cy="130" r="2.5" fill="#6F8FFF" />
  </g>

  <!-- ==================== LEFT SECTION: 3D FLOATING ISOMETRIC ACADEMIC CORE ==================== -->
  <g transform="translate(30, 25)">
    <!-- Header Badge -->
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#6F8FFF" letter-spacing="1.8">// ACADEMIC CREDENTIAL</text>

    <!-- Ground Shadow Beneath 3D Object -->
    <ellipse cx="88" cy="118" rx="34" ry="10" fill="#0A1838" class="shadow-pulse" filter="url(#neon-glow)" />

    <!-- 3D Floating Isometric Diamond/Cube -->
    <g class="iso-float" transform="translate(88, 72)">
      <!-- Hologram Orbit Ring around 3D Cube -->
      <g class="hologram-ring" transform="translate(0, 0)">
        <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="#4169E1" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.65" />
        <circle cx="45" cy="0" r="3" fill="#A4CAFE" filter="url(#neon-glow)" />
      </g>

      <!-- Isometric Cube Top Diamond -->
      <polygon points="0,-26 36,-8 0,10 -36,-8" fill="url(#cube-top)" filter="url(#neon-glow)" />
      
      <!-- Left Face -->
      <polygon points="-36,-8 0,10 0,42 -36,24" fill="url(#cube-left)" />
      
      <!-- Right Face -->
      <polygon points="0,10 36,-8 36,24 0,42" fill="url(#cube-right)" />

      <!-- Glowing AI Core Center Node -->
      <circle cx="0" cy="-8" r="5" fill="#FFFFFF" filter="url(#intense-glow)" />
      <circle cx="0" cy="-8" r="2.5" fill="#A4CAFE" />

      <!-- Isometric Tassel / Academic Ray -->
      <line x1="0" y1="-8" x2="30" y2="7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
      <circle cx="30" cy="7" r="3" fill="#6F8FFF" filter="url(#neon-glow)" />
    </g>

    <!-- 3D CGPA Glass Card -->
    <g transform="translate(12, 142)">
      <rect x="0" y="0" width="152" height="56" rx="12" fill="#0b1329" fill-opacity="0.85" stroke="#4169E1" stroke-width="1.2" />
      
      <!-- CGPA Number with Neon Breath Effect -->
      <text x="68" y="34" class="sans cgpa-glow" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">9.49</text>
      
      <!-- Star Sparkle Glint on Top Right of Number -->
      <g class="sparkle-anim" transform="translate(108, 18)">
        <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#A4CAFE" />
        <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
      </g>

      <text x="76" y="49" class="mono" font-size="9.5" font-weight="700" fill="#6F8FFF" text-anchor="middle" letter-spacing="1.2">CGPA / 10.00</text>
    </g>
  </g>

  <!-- ==================== MIDDLE SECTION: UNIVERSITY & SPECIALIZATION ==================== -->
  <g transform="translate(265, 28)">
    <!-- University Pill with Glowing Beacon -->
    <rect x="0" y="5" width="236" height="24" rx="12" fill="#0C1B3E" stroke="#4169E1" stroke-width="1.2" />
    <circle cx="14" cy="17" r="4" fill="#4169E1" filter="url(#neon-glow)" />
    <circle cx="14" cy="17" r="2" fill="#FFFFFF" />
    <text x="27" y="21" class="sans" font-size="10.5" font-weight="800" fill="#A4CAFE" letter-spacing="0.8">LOVELY PROFESSIONAL UNIVERSITY</text>

    <!-- Degree Title -->
    <text x="0" y="58" class="sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">Bachelor of Technology (B.Tech)</text>
    <text x="0" y="80" class="sans" font-size="14.5" font-weight="700" fill="#6F8FFF">Computer Science &amp; Engineering</text>

    <!-- AI & ML Specialization Badge with Glowing Left Accent -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="310" height="28" rx="6" fill="#081433" stroke="#4169E1" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="0" y="0" width="5" height="28" rx="2" fill="#6F8FFF" filter="url(#neon-glow)" />
      <text x="14" y="18" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">✦ SPECIALIZATION: AI &amp; MACHINE LEARNING</text>
    </g>

    <!-- Academic Labs & Coursework Tags -->
    <g transform="translate(0, 140)">
      <text x="0" y="9" class="mono" font-size="9" font-weight="700" fill="#6F8FFF" letter-spacing="1.5">CORE ENGINEERING COMPETENCIES:</text>
      
      <g transform="translate(0, 18)">
        <!-- Tag 1 -->
        <rect x="0" y="0" width="115" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <circle cx="10" cy="11" r="2.5" fill="#6F8FFF" />
        <text x="64" y="15" class="sans" font-size="9.5" font-weight="600" fill="#C5D7FF" text-anchor="middle">Machine Learning</text>

        <!-- Tag 2 -->
        <rect x="122" y="0" width="105" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <circle cx="132" cy="11" r="2.5" fill="#6F8FFF" />
        <text x="176" y="15" class="sans" font-size="9.5" font-weight="600" fill="#C5D7FF" text-anchor="middle">Deep Learning</text>

        <!-- Tag 3 -->
        <rect x="234" y="0" width="85" height="22" rx="5" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <circle cx="244" cy="11" r="2.5" fill="#6F8FFF" />
        <text x="278" y="15" class="sans" font-size="9.5" font-weight="600" fill="#C5D7FF" text-anchor="middle">DSA (C++/Py)</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: VERIFICATION & ACTIVE RADAR ==================== -->
  <g transform="translate(625, 28)">
    <!-- Futuristic Glass Profile Card -->
    <rect x="0" y="5" width="195" height="194" rx="12" fill="#060c1d" stroke="#162B5C" stroke-width="1.2" />

    <text x="16" y="32" class="mono" font-size="10" font-weight="700" fill="#6F8FFF" letter-spacing="1.2">STUDENT VERIFIED</text>
    <circle cx="170" cy="28" r="3" fill="#6F8FFF" filter="url(#neon-glow)" />

    <!-- Name & Role -->
    <text x="16" y="60" class="sans" font-size="15.5" font-weight="800" fill="#FFFFFF">Sohan Thammineni</text>
    <text x="16" y="78" class="sans" font-size="11.5" font-weight="600" fill="#6F8FFF">AI &amp; ML Engineer</text>

    <line x1="16" y1="92" x2="179" y2="92" stroke="#162B5C" stroke-width="1" />

    <!-- Active Radar Beacon -->
    <text x="16" y="112" class="mono" font-size="9" font-weight="600" fill="#5A73A3" letter-spacing="1">ENROLLMENT STATUS</text>
    
    <g transform="translate(0, 5)">
      <!-- Animated Radar Ping Rings -->
      <circle cx="24" cy="122" r="3.5" fill="#00E676" class="radar-wave" />
      <circle cx="24" cy="122" r="3.5" fill="#00E676" filter="url(#neon-glow)" />
      <circle cx="24" cy="122" r="1.8" fill="#FFFFFF" />
      <text x="36" y="126" class="sans" font-size="11" font-weight="700" fill="#E6FFFA">Undergraduate (Active)</text>
    </g>

    <!-- Location / University Hub -->
    <text x="16" y="156" class="mono" font-size="9" font-weight="600" fill="#5A73A3" letter-spacing="1">CAMPUS</text>
    <text x="16" y="172" class="sans" font-size="11.5" font-weight="600" fill="#C5D7FF">LPU · Punjab, India</text>
  </g>
</svg>