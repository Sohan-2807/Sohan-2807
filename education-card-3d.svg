<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#162B5C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6F8FFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F8FFF" />
      <stop offset="100%" stop-color="#4169E1" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4bb5" />
      <stop offset="100%" stop-color="#162B5C" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3177" />
      <stop offset="100%" stop-color="#0a1433" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6F8FFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .iso-float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <!-- Outer Card with 3D Border Glow -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Subtle Background Grid Accent -->
  <g opacity="0.12" stroke="#4169E1" stroke-width="0.8">
    <line x1="40" y1="50" x2="810" y2="50" />
    <line x1="40" y1="195" x2="810" y2="195" />
    <line x1="240" y1="20" x2="240" y2="230" />
    <line x1="600" y1="20" x2="600" y2="230" />
  </g>

  <!-- ==================== LEFT SECTION: 3D CGPA & ISOMETRIC CUBE ==================== -->
  <g transform="translate(30, 25)">
    <!-- Header Tag -->
    <text x="10" y="22" class="mono" font-size="10" font-weight="600" fill="#6F8FFF" letter-spacing="1.5">ACADEMIC EXCELLENCE</text>

    <!-- 3D Floating Isometric Cap / Cube Graphic -->
    <g class="iso-float" transform="translate(85, 80)">
      <!-- 3D Isometric Cube / Graduation Diamond Top -->
      <polygon points="0,-24 35,-6 0,12 -35,-6" fill="url(#cube-top)" />
      <!-- Left Face -->
      <polygon points="-35,-6 0,12 0,42 -35,24" fill="url(#cube-left)" />
      <!-- Right Face -->
      <polygon points="0,12 35,-6 35,24 0,42" fill="url(#cube-right)" />
      
      <!-- Inner Glowing Core Symbol (AI Node) -->
      <circle cx="0" cy="-6" r="4.5" fill="#FFFFFF" filter="url(#neon-glow)" />
      
      <!-- Isometric Tassel / Ray -->
      <line x1="0" y1="-6" x2="28" y2="8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
      <circle cx="28" cy="8" r="2.5" fill="#6F8FFF" />
    </g>

    <!-- CGPA Big Metric Display -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="150" height="58" rx="10" fill="url(#badge-grad)" stroke="#4169E1" stroke-width="1" stroke-opacity="0.4" />
      <text x="75" y="32" class="sans" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">9.49</text>
      <text x="75" y="48" class="mono" font-size="10" font-weight="600" fill="#6F8FFF" text-anchor="middle" letter-spacing="1">CGPA / 10.00</text>
    </g>
  </g>

  <!-- ==================== MIDDLE SECTION: DEGREE & UNIVERSITY ==================== -->
  <g transform="translate(265, 30)">
    <!-- University Pill Badge -->
    <rect x="0" y="5" width="230" height="22" rx="11" fill="#162B5C" fill-opacity="0.6" stroke="#4169E1" stroke-width="1" />
    <circle cx="12" cy="16" r="3.5" fill="#4169E1" class="pulse-dot" />
    <text x="24" y="20" class="sans" font-size="10.5" font-weight="700" fill="#A4CAFE" letter-spacing="0.8">LOVELY PROFESSIONAL UNIVERSITY</text>

    <!-- Degree Title -->
    <text x="0" y="58" class="sans" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">Bachelor of Technology (B.Tech)</text>
    <text x="0" y="80" class="sans" font-size="14" font-weight="700" fill="#6F8FFF">Computer Science &amp; Engineering</text>

    <!-- Specialization Pill -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="295" height="26" rx="6" fill="#0A1433" stroke="#4169E1" stroke-width="1" stroke-opacity="0.7" />
      <text x="10" y="17" class="mono" font-size="11" font-weight="600" fill="#E0EAFF">✦ SPECIALIZATION: AI &amp; MACHINE LEARNING</text>
    </g>

    <!-- Core Focus Badges -->
    <g transform="translate(0, 138)">
      <text x="0" y="10" class="mono" font-size="9.5" fill="#6F8FFF" letter-spacing="1.2">ACADEMIC FOUNDATIONS &amp; LABS:</text>
      
      <g transform="translate(0, 20)">
        <!-- Tag 1 -->
        <rect x="0" y="0" width="115" height="20" rx="4" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <text x="57" y="14" class="sans" font-size="9.5" fill="#A4CAFE" text-anchor="middle">Machine Learning</text>

        <!-- Tag 2 -->
        <rect x="122" y="0" width="110" height="20" rx="4" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <text x="177" y="14" class="sans" font-size="9.5" fill="#A4CAFE" text-anchor="middle">Data Structures</text>

        <!-- Tag 3 -->
        <rect x="238" y="0" width="70" height="20" rx="4" fill="#081026" stroke="#162B5C" stroke-width="1" />
        <text x="273" y="14" class="sans" font-size="9.5" fill="#A4CAFE" text-anchor="middle">Algorithms</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: VERIFICATION & STATUS ==================== -->
  <g transform="translate(625, 30)">
    <!-- Status Box -->
    <rect x="0" y="5" width="195" height="190" rx="12" fill="#060b18" stroke="#162B5C" stroke-width="1" />

    <text x="16" y="32" class="mono" font-size="10" font-weight="600" fill="#6F8FFF" letter-spacing="1">STUDENT PROFILE</text>

    <!-- Name & Role -->
    <text x="16" y="60" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Sohan Thammineni</text>
    <text x="16" y="78" class="sans" font-size="11.5" font-weight="600" fill="#6F8FFF">AI &amp; ML Specialist</text>

    <line x1="16" y1="92" x2="179" y2="92" stroke="#162B5C" stroke-width="0.8" />

    <!-- Details -->
    <text x="16" y="112" class="mono" font-size="9" fill="#5A73A3">STATUS</text>
    <g transform="translate(16, 120)">
      <circle cx="4" cy="5" r="3.5" fill="#00E676" />
      <text x="14" y="9" class="sans" font-size="11" font-weight="700" fill="#E0EAFF">Undergraduate (Active)</text>
    </g>

    <text x="16" y="152" class="mono" font-size="9" fill="#5A73A3">LOCATION</text>
    <text x="16" y="168" class="sans" font-size="11" font-weight="600" fill="#C5D7FF">Punjab, India</text>
  </g>
</svg>